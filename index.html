<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Uzay Strateji Oyunu</title>
    <style>
        body {
            margin: 0;
            background-color: #111111;
            color: #ffffff;
            font-family: monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            border: 2px solid #333333;
            background-color: #1a1a1a;
        }
        #ui {
            margin-bottom: 10px;
            background: #222;
            padding: 10px 20px;
            border-radius: 5px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <div id="ui">
        Durum: <span id="status" style="color: #ff3366;">Bağlanıyor...</span> | Demir: <span id="ironCount" style="color: #00ffcc;">0</span>
        <div style="font-size: 11px; color: #aaa; margin-top: 4px;">Kontroller: W, A, S, D veya Yön Tuşları</div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    <script>
        const socket = io("https://space-strategy-game-igo7.onrender.com");
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let myId = null;
        let gameState = { players: {}, minerals: [] };

        // Tuş durumlarını tutmak için nesne
        const keys = { up: false, down: false, left: false, right: false };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.up = true;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.down = true;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.up = false;
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.down = false;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
        });

        socket.on('init', (data) => {
            myId = data.id;
            gameState = data.state;
            document.getElementById('status').innerText = "Bağlandı!";
            document.getElementById('status').style.color = "#00ffcc";
        });

        socket.on('updateState', (state) => {
            gameState = state;
            if (myId && gameState.players[myId]) {
                document.getElementById('ironCount').innerText = Math.floor(gameState.players[myId].iron);
            }
        });

        // Sürekli olarak tuş verilerini sunucuya gönder
        setInterval(() => {
            if (myId) {
                socket.emit('move', keys);
            }
        }, 1000 / 30);

        function draw() {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Madenleri Çiz
            gameState.minerals.items = gameState.minerals || [];
            (gameState.minerals || []).forEach(m => {
                ctx.beginPath();
                ctx.arc(m.x, m.y, 15, 0, Math.PI * 2);
                ctx.fillStyle = '#00ffcc';
                ctx.fill();
                ctx.strokeStyle = '#008b8b';
                ctx.stroke();
            });

            // Oyuncuları Çiz (Kendi gemin sarı, diğer oyuncular kırmızı)
            for (let id in gameState.players) {
                let p = gameState.players[id];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = (id === myId) ? '#ffff00' : '#ff3366';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
        loop();
    </script>
</body>
</html>
